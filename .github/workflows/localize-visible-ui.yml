name: Localize visible frontend UI

on:
  push:
    branches:
      - refactor/new-game-dialog

permissions:
  contents: write

jobs:
  localize-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/new-game-dialog

      - name: Apply localization and component extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one {label}, found {text.count(old)}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Central translations
          # ------------------------------------------------------------------
          i18n_path = Path("src/i18n/I18nProvider.tsx")
          i18n = i18n_path.read_text(encoding="utf-8")

          i18n = replace_once(
              i18n,
              '  "common.cancel": { en: "Cancel", de: "Abbrechen", fr: "Annuler" },\n',
              '  "common.cancel": { en: "Cancel", de: "Abbrechen", fr: "Annuler" },\n'
              '  "common.ok": { en: "OK", de: "OK", fr: "OK" },\n',
              "common.cancel translation",
          )

          i18n = replace_once(
              i18n,
              '  "common.size": { en: "Size", de: "Größe", fr: "Taille" },\n\n',
              '  "common.size": { en: "Size", de: "Größe", fr: "Taille" },\n\n'
              '  "moves.title": { en: "Moves", de: "Züge", fr: "Coups" },\n'
              '  "moves.empty": { en: "No moves yet", de: "Noch keine Züge", fr: "Aucun coup pour le moment" },\n'
              '  "moves.computerThinking": { en: "Computer is thinking…", de: "Computer denkt nach…", fr: "L’ordinateur réfléchit…" },\n'
              '  "moves.loading": { en: "Loading / applying moves…", de: "Züge werden geladen / angewendet…", fr: "Chargement / application des coups…" },\n'
              '  "moves.error": { en: "Error: {message}", de: "Fehler: {message}", fr: "Erreur : {message}" },\n\n',
              "common.size translation",
          )

          analysis_marker = '''  "analysis.analyzeTitle": {
    en: "Analyze the loaded PGN game",
    de: "Geladene PGN-Partie analysieren",
    fr: "Analyser la partie PGN chargée",
  },
'''
          analysis_additions = analysis_marker + '''  "analysis.dialogTitle": { en: "Analysis", de: "Analyse", fr: "Analyse" },
  "analysis.dialogDescription": {
    en: "The game is replayed from the initial position. After every ply, the selected analysis engine evaluates the new position.",
    de: "Die Partie wird von der Ausgangsstellung aus nachgespielt. Nach jedem Halbzug bewertet die ausgewählte Analyse-Engine die neue Stellung.",
    fr: "La partie est rejouée depuis la position initiale. Après chaque demi-coup, le moteur d’analyse sélectionné évalue la nouvelle position.",
  },
  "analysis.engineProfile": { en: "Engine profile", de: "Engine-Profil", fr: "Profil du moteur" },
  "analysis.depth": { en: "Depth (0 = time per position)", de: "Tiefe (0 = Zeit pro Stellung)", fr: "Profondeur (0 = temps par position)" },
  "analysis.timePerPosition": { en: "Time per position (seconds)", de: "Zeit pro Stellung (Sekunden)", fr: "Temps par position (secondes)" },
  "analysis.profile": { en: "Profile", de: "Profil", fr: "Profil" },
  "analysis.engine": { en: "Engine", de: "Engine", fr: "Moteur" },
  "analysis.search": { en: "Search", de: "Suche", fr: "Recherche" },
  "analysis.searchDepth": { en: "depth {depth}", de: "Tiefe {depth}", fr: "profondeur {depth}" },
  "analysis.searchTime": { en: "{seconds}s per position", de: "{seconds}s pro Stellung", fr: "{seconds}s par position" },
  "analysis.noEngineProfile": {
    en: "No engine profile is available. Create one under Engine Settings first.",
    de: "Kein Engine-Profil verfügbar. Erstelle zuerst eines unter Engine-Einstellungen.",
    fr: "Aucun profil de moteur n’est disponible. Créez-en d’abord un dans les paramètres des moteurs.",
  },
  "analysis.starting": { en: "Starting…", de: "Wird gestartet…", fr: "Démarrage…" },
'''
          i18n = replace_once(i18n, analysis_marker, analysis_additions, "analysis translation marker")

          settings_marker = '  "settings.engineSaved": { en: "Engine saved.", de: "Engine gespeichert.", fr: "Moteur enregistré." },\n'
          settings_additions = settings_marker + '''  "settings.subtitle": {
    en: "Engines, reusable profiles, and their assignments",
    de: "Engines, wiederverwendbare Profile und ihre Zuordnungen",
    fr: "Moteurs, profils réutilisables et leurs affectations",
  },
  "settings.version": { en: "Version {version}", de: "Version {version}", fr: "Version {version}" },
  "settings.scanSystem": { en: "Scan /usr/games", de: "/usr/games durchsuchen", fr: "Analyser /usr/games" },
  "settings.reset": { en: "Reset Engines & Profiles", de: "Engines und Profile zurücksetzen", fr: "Réinitialiser moteurs et profils" },
  "settings.area": { en: "Engine settings area", de: "Bereich Engine-Einstellungen", fr: "Zone des paramètres des moteurs" },
  "settings.defaults": { en: "Defaults", de: "Standards", fr: "Valeurs par défaut" },
  "settings.profiles": { en: "Profiles", de: "Profile", fr: "Profils" },
  "settings.engines": { en: "Engines", de: "Engines", fr: "Moteurs" },
  "settings.useCases": { en: "Use Cases", de: "Anwendungsfälle", fr: "Cas d’utilisation" },
  "settings.useCasesDescription": {
    en: "Profiles are independent of their use case",
    de: "Profile sind unabhängig von ihrem Anwendungsfall",
    fr: "Les profils sont indépendants de leur cas d’utilisation",
  },
  "settings.whiteCpu": { en: "White CPU", de: "Weiß CPU", fr: "CPU Blancs" },
  "settings.blackCpu": { en: "Black CPU", de: "Schwarz CPU", fr: "CPU Noirs" },
  "settings.liveEvaluation": { en: "Live Evaluation", de: "Live-Bewertung", fr: "Évaluation en direct" },
  "settings.deepAnalysis": { en: "Deep Analysis", de: "Tiefenanalyse", fr: "Analyse approfondie" },
  "settings.noProfile": { en: "No profile", de: "Kein Profil", fr: "Aucun profil" },
  "settings.defaultAssignments": { en: "Default Profile Assignments", de: "Standard-Profilzuweisungen", fr: "Affectations de profils par défaut" },
  "settings.defaultAssignmentsDescription": {
    en: "A profile only describes its engine configuration. This section defines which profile each use case uses by default.",
    de: "Ein Profil beschreibt nur die Engine-Konfiguration. Hier wird festgelegt, welches Profil jeder Anwendungsfall standardmäßig verwendet.",
    fr: "Un profil décrit uniquement la configuration du moteur. Cette section définit le profil utilisé par défaut pour chaque cas d’utilisation.",
  },
  "settings.global": { en: "Global", de: "Global", fr: "Global" },
  "settings.fallback": { en: "Fallback", de: "Fallback", fr: "Secours" },
  "settings.detectedUciEngine": { en: "the detected UCI engine", de: "die erkannte UCI-Engine", fr: "le moteur UCI détecté" },
  "settings.fallbackInfoBefore": { en: "The fallback profile remains bound to", de: "Das Fallback-Profil bleibt gebunden an", fr: "Le profil de secours reste lié à" },
  "settings.fallbackInfoAfter": {
    en: "so the application always has a valid engine profile available. It can be edited like any other profile, but it cannot be deleted while it is the fallback.",
    de: "damit der Anwendung immer ein gültiges Engine-Profil zur Verfügung steht. Es kann wie jedes andere Profil bearbeitet werden, kann aber nicht gelöscht werden, solange es das Fallback-Profil ist.",
    fr: "afin que l’application dispose toujours d’un profil de moteur valide. Il peut être modifié comme les autres profils, mais ne peut pas être supprimé tant qu’il sert de profil de secours.",
  },
  "settings.fallbackStockfish": {
    en: "is preferred as the fallback engine when available.",
    de: "wird als Fallback-Engine bevorzugt, wenn es verfügbar ist.",
    fr: "est préféré comme moteur de secours lorsqu’il est disponible.",
  },
  "settings.whiteCpuPlayer": { en: "White CPU Player", de: "CPU-Spieler Weiß", fr: "Joueur CPU Blancs" },
  "settings.whiteCpuDescription": { en: "Profile used when White is controlled by the computer.", de: "Profil, das verwendet wird, wenn Weiß vom Computer gesteuert wird.", fr: "Profil utilisé lorsque les Blancs sont contrôlés par l’ordinateur." },
  "settings.blackCpuPlayer": { en: "Black CPU Player", de: "CPU-Spieler Schwarz", fr: "Joueur CPU Noirs" },
  "settings.blackCpuDescription": { en: "Profile used when Black is controlled by the computer.", de: "Profil, das verwendet wird, wenn Schwarz vom Computer gesteuert wird.", fr: "Profil utilisé lorsque les Noirs sont contrôlés par l’ordinateur." },
  "settings.liveEvaluationDescription": { en: "Profile used for live position evaluation.", de: "Profil für die laufende Stellungsbewertung.", fr: "Profil utilisé pour l’évaluation en direct de la position." },
  "settings.deepAnalysisDescription": { en: "Default selection for a new Deep Analysis run.", de: "Standardauswahl für eine neue Tiefenanalyse.", fr: "Sélection par défaut pour une nouvelle analyse approfondie." },
  "settings.unknownEngine": { en: "Unknown engine", de: "Unbekannte Engine", fr: "Moteur inconnu" },
  "settings.saving": { en: "Saving…", de: "Wird gespeichert…", fr: "Enregistrement…" },
  "settings.saveDefaults": { en: "Save Defaults", de: "Standards speichern", fr: "Enregistrer les valeurs par défaut" },
'''
          i18n = replace_once(i18n, settings_marker, settings_additions, "settings translation marker")
          i18n_path.write_text(i18n, encoding="utf-8")

          # ------------------------------------------------------------------
          # Engine settings: direct React i18n for the visible manager shell and
          # default assignments screen.
          # ------------------------------------------------------------------
          engine_path = Path("src/EngineConfigManager.tsx")
          engine = engine_path.read_text(encoding="utf-8")
          engine = replace_once(
              engine,
              'import { fetchEngineConfigOverview } from "./engineConfig";\n',
              'import { fetchEngineConfigOverview } from "./engineConfig";\nimport { useI18n } from "./i18n/I18nProvider";\n',
              "EngineConfigManager i18n import",
          )
          engine = replace_once(
              engine,
              '}: EngineConfigManagerProps) {\n  const [mode, setMode] = useState<ManagerMode>("DEFAULTS");',
              '}: EngineConfigManagerProps) {\n  const { t } = useI18n();\n  const [mode, setMode] = useState<ManagerMode>("DEFAULTS");',
              "EngineConfigManager hook",
          )

          replacements = {
              'result.push("White CPU")': 'result.push(t("settings.whiteCpu"))',
              'result.push("Black CPU")': 'result.push(t("settings.blackCpu"))',
              'result.push("Evaluation")': 'result.push(t("settings.liveEvaluation"))',
              'result.push("Deep Analysis")': 'result.push(t("settings.deepAnalysis"))',
              '<span className="engine-config-chip">Fallback</span>': '<span className="engine-config-chip">{t("settings.fallback")}</span>',
              '<span>{engine?.name ?? "Unknown engine"}</span>': '<span>{engine?.name ?? t("settings.unknownEngine")}</span>',
              'aria-label="Engine Settings"': 'aria-label={t("engine.settings")}',
              '<h2>Engine Settings</h2>': '<h2>{t("engine.settings")}</h2>',
              '              Engines, reusable profiles, and their assignments\n              {overview && <span> · Version {overview.version}</span>}': '              {t("settings.subtitle")}\n              {overview && <span> · {t("settings.version", { version: overview.version })}</span>}',
              '              Scan /usr/games': '              {t("settings.scanSystem")}',
              '              Reset Engines &amp; Profiles': '              {t("settings.reset")}',
              '<button type="button" onClick={onClose} disabled={busy}>Close</button>': '<button type="button" onClick={onClose} disabled={busy}>{t("common.close")}</button>',
              'aria-label="Engine settings area"': 'aria-label={t("settings.area")}',
              '            Defaults\n': '            {t("settings.defaults")}\n',
              '            Profiles\n': '            {t("settings.profiles")}\n',
              '            Engines\n': '            {t("settings.engines")}\n',
              '<strong>Use Cases</strong>': '<strong>{t("settings.useCases")}</strong>',
              '<span>Profiles are independent of their use case</span>': '<span>{t("settings.useCasesDescription")}</span>',
              '["whitePlayerProfileId", "White CPU"]': '["whitePlayerProfileId", t("settings.whiteCpu")]',
              '["blackPlayerProfileId", "Black CPU"]': '["blackPlayerProfileId", t("settings.blackCpu")]',
              '["evaluationProfileId", "Live Evaluation"]': '["evaluationProfileId", t("settings.liveEvaluation")]',
              '["deepAnalysisProfileId", "Deep Analysis"]': '["deepAnalysisProfileId", t("settings.deepAnalysis")]',
              '{profile?.name ?? "No profile"}': '{profile?.name ?? t("settings.noProfile")}',
              '<strong>Default Profile Assignments</strong>': '<strong>{t("settings.defaultAssignments")}</strong>',
              '                        A profile only describes its engine configuration. This section defines\n                        which profile each use case uses by default.': '                        {t("settings.defaultAssignmentsDescription")}',
              '<span className="engine-config-chip">Global</span>': '<span className="engine-config-chip">{t("settings.global")}</span>',
              '                      "White CPU Player",\n                      "Profile used when White is controlled by the computer."': '                      t("settings.whiteCpuPlayer"),\n                      t("settings.whiteCpuDescription")',
              '                      "Black CPU Player",\n                      "Profile used when Black is controlled by the computer."': '                      t("settings.blackCpuPlayer"),\n                      t("settings.blackCpuDescription")',
              '                      "Live Evaluation",\n                      "Profile used for live position evaluation."': '                      t("settings.liveEvaluation"),\n                      t("settings.liveEvaluationDescription")',
              '                      "Deep Analysis",\n                      "Default selection for a new Deep Analysis run."': '                      t("settings.deepAnalysis"),\n                      t("settings.deepAnalysisDescription")',
              '{busy ? "Saving…" : "Save Defaults"}': '{busy ? t("settings.saving") : t("settings.saveDefaults")}',
          }
          for old, new in replacements.items():
              engine = replace_once(engine, old, new, f"EngineConfigManager text: {old[:40]}")

          fallback_old = '''                  <div className="engine-config-default-info">
                    The fallback profile remains bound to <strong>{fallbackEngine?.engine ?? "the detected UCI engine"}</strong> so the
                    application always has a valid engine profile available. It can be edited like any other profile, but it cannot be deleted
                    while it is the fallback. <strong>/usr/games/stockfish</strong> is preferred as the fallback engine when available.
                  </div>'''
          fallback_new = '''                  <div className="engine-config-default-info">
                    {t("settings.fallbackInfoBefore")} <strong>{fallbackEngine?.engine ?? t("settings.detectedUciEngine")}</strong>{" "}
                    {t("settings.fallbackInfoAfter")} <strong>/usr/games/stockfish</strong>{" "}
                    {t("settings.fallbackStockfish")}
                  </div>'''
          engine = replace_once(engine, fallback_old, fallback_new, "fallback information")
          engine_path.write_text(engine, encoding="utf-8")

          # ------------------------------------------------------------------
          # ChessBoard: move the visible move list and analysis dialog into
          # dedicated localized components. This also keeps the orchestrator
          # comfortably below our 4000-line guardrail.
          # ------------------------------------------------------------------
          board_path = Path("src/ChessBoard.tsx")
          board = board_path.read_text(encoding="utf-8")
          board = replace_once(
              board,
              'import NewGameDialog from "./chess/game/NewGameDialog";\n',
              'import NewGameDialog from "./chess/game/NewGameDialog";\nimport MovePanel from "./chess/game/MovePanel";\nimport AnalysisSettingsDialog from "./chess/analysis/AnalysisSettingsDialog";\n',
              "ChessBoard extracted component imports",
          )

          move_replacement = '''          <MovePanel
            state={{
              moves,
              whitePlayerName: analysisReplayActive
                ? getAnalysisWhitePlayerName(clock, analysisWhitePlayerName)
                : uciAnalysisLoaded
                  ? analysisWhitePlayerName || "White"
                  : getDisplayedWhitePlayerName(clock, whiteComputerEnabled),
              blackPlayerName: analysisReplayActive
                ? getAnalysisBlackPlayerName(clock, analysisBlackPlayerName)
                : uciAnalysisLoaded
                  ? analysisBlackPlayerName || "Black"
                  : getDisplayedBlackPlayerName(clock, blackComputerEnabled),
              whiteActive: !uciAnalysisLoaded && clock?.sideToMove === "white",
              blackActive: !uciAnalysisLoaded && clock?.sideToMove === "black",
              selectedPly: analysisSelectedPosition?.ply ?? null,
              loadingMoves: isLoadingMoves,
              computerThinking: isComputerThinking,
              error: loadError,
            }}
            actions={{
              showPreview: showMovePreview,
              movePreview: moveMovePreview,
              hidePreview: hideMovePreview,
              selectPosition: selectAnalysisPosition,
            }}
          />

          <section className="board-column">'''
          board, count = re.subn(
              r'          <section className="moves-panel">[\s\S]*?          </section>\n\n          <section className="board-column">',
              move_replacement,
              board,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Expected one moves-panel block, replaced {count}")

          analysis_replacement = '''          {showAnalysisSettingsDialog && (
            <AnalysisSettingsDialog
              settings={analysisSettings}
              profiles={analysisEngineProfiles}
              selectedProfile={selectedAnalysisProfile}
              selectedEngine={selectedAnalysisEngine}
              error={analysisReplayError}
              running={isAnalysisReplayRunning}
              onSettingsChange={setAnalysisSettings}
              onCancel={() => setShowAnalysisSettingsDialog(false)}
              onStart={() => void startAnalysisReplay()}
            />
          )}

          {showGameEndDialog && gameEndState && ('''
          board, count = re.subn(
              r'          \{showAnalysisSettingsDialog && \([\s\S]*?          \)\}\n\n          \{showGameEndDialog && gameEndState && \(',
              analysis_replacement,
              board,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Expected one analysis settings block, replaced {count}")

          board_path.write_text(board, encoding="utf-8")
          line_count = len(board.splitlines())
          print(f"ChessBoard.tsx line count: {line_count}")
          if line_count >= 4000:
              raise SystemExit(f"ChessBoard.tsx exceeds guardrail: {line_count} lines")
          PY

          git diff --check

      - name: Commit localization refactor
        shell: bash
        run: |
          rm .github/workflows/localize-visible-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ChessBoard.tsx src/EngineConfigManager.tsx src/i18n/I18nProvider.tsx .github/workflows/localize-visible-ui.yml
          git commit -m "Localize analysis, moves and engine defaults UI"
          git push origin HEAD:refactor/new-game-dialog
