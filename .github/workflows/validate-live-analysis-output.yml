name: Validate live analysis output fix

on:
  push:
    branches:
      - fix/live-analysis-output

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-analysis-output

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Remove temporary validation workflow
        if: success()
        run: |
          rm .github/workflows/validate-live-analysis-output.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-live-analysis-output.yml
          git commit -m "Remove temporary live analysis validation workflow"
          git push origin HEAD:fix/live-analysis-output
