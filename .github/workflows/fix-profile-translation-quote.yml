name: Fix profile translation syntax

on:
  push:
    branches:
      - refactor/new-game-dialog

permissions:
  contents: write

jobs:
  fix-translation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/new-game-dialog

      - name: Fix malformed translation string
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/i18n/I18nProvider.tsx')
          text = path.read_text(encoding='utf-8')
          old = '  "settings.deleteProfileConfirm": { en: "Delete engine profile "{name}"?", de: "Engine-Profil "{name}" löschen?", fr: "Supprimer le profil de moteur "{name}" ?" },'
          new = '  "settings.deleteProfileConfirm": { en: \'Delete engine profile "{name}"?\', de: \'Engine-Profil "{name}" löschen?\', fr: \'Supprimer le profil de moteur "{name}" ?\' },'
          if text.count(old) != 1:
              raise SystemExit(f'Expected malformed translation exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit syntax fix
        shell: bash
        run: |
          rm .github/workflows/fix-profile-translation-quote.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/I18nProvider.tsx .github/workflows/fix-profile-translation-quote.yml
          git commit -m "Fix profile deletion translation syntax"
          git push origin HEAD:refactor/new-game-dialog
