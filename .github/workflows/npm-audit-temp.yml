name: Temporary npm audit

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/npm-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit
        run: npm audit || true
