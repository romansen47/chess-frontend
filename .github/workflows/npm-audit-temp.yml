name: Temporary npm audit fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/npm-audit-temp.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply compatible audit fixes
        run: npm audit fix
      - name: Verify clean install, audit and build
        run: |
          npm ci
          npm audit
          npm run build
      - name: Commit lockfile fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "No audit changes required."
            exit 0
          fi
          git commit -m "Apply npm audit fixes"
          git push
