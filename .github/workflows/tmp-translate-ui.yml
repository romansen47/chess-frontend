name: Temporary UI translation

on:
  push:
    branches: [work]

permissions:
  contents: write

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Translate displayed German text to English
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              # Shared analysis score text.
              'Mate für Weiß': 'Mate for White',
              'Mate für Schwarz': 'Mate for Black',
