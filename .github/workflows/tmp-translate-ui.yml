              'Weiß gewinnt durch Zeitüberschreitung von Schwarz.': 'White wins because Black ran out of time.',
              'Partie durch Zeitüberschreitung beendet.': 'Game ended on time.',
              'Schwarz gewinnt durch Matt.': 'Black wins by checkmate.',
              'Weiß gewinnt durch Matt.': 'White wins by checkmate.',
              'Schwarz gewinnt durch Aufgabe von Weiß.': 'Black wins because White resigned.',
              'Weiß gewinnt durch Aufgabe von Schwarz.': 'White wins because Black resigned.',
              'Remis durch die 50-Züge-Regel.': 'Draw by the fifty-move rule.',
              'Remis durch dreifache Stellungswiederholung.': 'Draw by threefold repetition.',
              'Partie beendet: ${gameState}': 'Game ended: ${gameState}',
              'Die Partie ist beendet.': 'The game has ended.',
              'Konnte Brett vom Server nicht laden.': 'Could not load the board from the server.',
              'Uhr konnte nicht geladen werden.': 'Could not load the clock.',
              'Fehler beim Laden der möglichen Züge.': 'Failed to load possible moves.',
              'Fehler beim Laden der Engine-Evaluation.': 'Failed to load the engine evaluation.',
              'Fehler bei der Analyse-Evaluation.': 'Failed to load the analysis evaluation.',
              'Programm konnte nicht beendet werden.': 'Could not terminate the program.',
              'PGN-Datei konnte nicht gespeichert werden.': 'Could not save the PGN file.',
              'PGN-Datei konnte nicht geladen werden.': 'Could not load the PGN file.',
