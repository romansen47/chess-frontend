              'Laufende Analyse abbrechen': 'Cancel running analysis',
              'Analyse abbrechen': 'Cancel analysis',
              'Optionen nach der abgeschlossenen Analyse öffnen': 'Open options after the completed analysis',
              '>\n              Optionen\n            </button>': '>\n              Options\n            </button>',
              'Geladene PGN-Partie erneut analysieren': 'Analyze the loaded PGN game again',
              'Analyse erneut': 'Analyze again',
              'Geladene PGN-Partie analysieren': 'Analyze the loaded PGN game',
              '>\n              Analyse\n            </button>': '>\n              Analyze\n            </button>',
              'Partie laden, speichern, neu starten oder Programm beenden': 'Load or save a game, start a new game, or exit the program',
              'Engines und Profile verwalten': 'Manage engines and profiles',
              'Weiße Spieler-Engine ausschalten': 'Disable White player engine',
              'Weiße Spieler-Engine einschalten': 'Enable White player engine',
              'Schwarze Spieler-Engine ausschalten': 'Disable Black player engine',
              'Schwarze Spieler-Engine einschalten': 'Enable Black player engine',
              'Evaluation-Engine ausschalten': 'Disable evaluation engine',
              'Evaluation-Engine einschalten · Bewertung 0.0': 'Enable evaluation engine · evaluation 0.0',
              'Evaluation-Engine einschalten': 'Enable evaluation engine',
              'Analyse-Evaluation ausschalten': 'Disable analysis evaluation',
              'Analyse-Evaluation einschalten': 'Enable analysis evaluation',
              'Zug auswählen, um die Evaluation-Engine zu verwenden': 'Select a move to use the evaluation engine',
              'Evaluation-Engine für den ausgewählten Zug einschalten': 'Enable the evaluation engine for the selected move',
              'Promotion für{" "}}': 'Promotion for{" "}}',
              'Promotion für{" "}': 'Promotion for{" "}',
              '"weißen"': '"white"',
              '"schwarzen"': '"black"',
              'Bauern ({promotionContext.from} → {promotionContext.to}):': 'pawn ({promotionContext.from} → {promotionContext.to}):',
              '<h2>Analyse</h2>': '<h2>Analysis</h2>',
              'Die Partie wird von der Ausgangsstellung aus nachgespielt.': 'The game is replayed from the initial position.',
              'Nach jedem Halbzug bewertet die gewählte Analyse-Engine die neue Stellung.': 'After every ply, the selected analysis engine evaluates the new position.',
              '>\n                    Analyse\n                  </button>': '>\n                    Analyze\n                  </button>',

              # EngineConfigManager.
              'System-Dateiauswahl wird geöffnet…': 'Opening system file picker…',
              'Engines, wiederverwendbare Profile und ihre Verwendung': 'Engines, reusable profiles, and their assignments',
              '>Schließen</button>': '>Close</button>',
              'Profile sind unabhängig vom Einsatzzweck': 'Profiles are independent of their use case',
              'Ein Profil beschreibt nur seine Engine-Konfiguration. Hier wird festgelegt,': 'A profile only describes its engine configuration. This section defines',
              'welches Profil ein konkreter Anwendungsfall standardmäßig benutzt.': 'which profile each use case uses by default.',
              'Das Fallback-Profil bleibt an <strong>{fallbackEngine?.engine ?? "die erkannte UCI-Engine"}</strong> mit deren': 'The fallback profile remains bound to <strong>{fallbackEngine?.engine ?? "the detected UCI engine"}</strong> with its',
              'UCI-Defaultwerten gebunden. <strong>/usr/games/stockfish</strong> wird bevorzugt, wenn es dort als gültige UCI-Engine': 'UCI default values. <strong>/usr/games/stockfish</strong> is preferred when it is detected there as a valid UCI engine',
              'erkannt wird. Jedes andere Profil kann gleichzeitig mehreren Aufgaben zugewiesen werden.': 'Each other profile can be assigned to multiple tasks at the same time.',
              'Profil, sobald Weiß als Computer spielt.': 'Profile used when White is controlled by the computer.',
              'Profil, sobald Schwarz als Computer spielt.': 'Profile used when Black is controlled by the computer.',
              'Profil für die laufende Stellungsbewertung.': 'Profile used for live position evaluation.',
              'Vorauswahl für einen neuen Deep-Analysis-Lauf.': 'Default selection for a new Deep Analysis run.',
              '"Engine und konkrete UCI-Werte"': '"Engine and concrete UCI values"',
              'Noch keine Engine definiert.': 'No engine has been defined yet.',
              'Noch kein Profil definiert.': 'No profile has been defined yet.',
              'Schritt 1 · Executable über die System-Dateiauswahl auswählen': 'Step 1 · Select the executable using the system file picker',
              'Wird sonst aus der UCI-Engine übernommen': 'Otherwise taken from the UCI engine',
              'Der Dateidialog wird auf dem Rechner geöffnet, auf dem das Backend läuft. Nach der Auswahl wird die Engine automatisch per UCI eingelesen.': 'The file dialog opens on the computer running the backend. After selection, the engine is inspected automatically through UCI.',
              'Dateiauswahl läuft…': 'File picker is open…',
              'Engine-Datei auswählen…': 'Select engine file…',
              'Keine Engine ausgewählt': 'No engine selected',
              'Wähle links eine Engine oder lege eine neue Definition an.': 'Select an engine on the left or create a new definition.',
              'Engine definition prüfen': 'Review engine definition',
              'UCI-Metadaten und erkannte Engine-Fähigkeiten': 'UCI metadata and detected engine capabilities',
              'Schritt 2 · Erkannte Engine und UCI-Fähigkeiten prüfen und speichern': 'Step 2 · Review and save the detected engine and UCI capabilities',
              'Von der Engine gemeldete Fähigkeiten und Original-Defaults. Konkrete Werte werden ausschließlich in Profilen festgelegt.': 'Capabilities and original defaults reported by the engine. Concrete values are configured exclusively in profiles.',
              'Andere Engine auswählen…': 'Select another engine…',
              'Neues Profil': 'New profile',
              'Schritt 1 · Bereits definierte Engine auswählen': 'Step 1 · Select an already defined engine',
              'Keine Engine vorhanden': 'No engine available',
              'Kein Profil ausgewählt': 'No profile selected',
              'Wähle links ein Profil oder lege ein neues an.': 'Select a profile on the left or create a new one.',
              'Profil konfigurieren': 'Configure profile',
              '${profileEngine.name} · wiederverwendbare Engine-Konfiguration': '${profileEngine.name} · reusable engine configuration',
              'Schritt 2 · UCI-Werte für ${profileEngine.name} festlegen': 'Step 2 · Configure UCI values for ${profileEngine.name}',
              'Dieses Profil ist der feste Fallback für <strong>{profileEngine.engine}</strong> und bleibt auf dessen': 'This profile is the fixed fallback for <strong>{profileEngine.engine}</strong> and remains on its',
              'UCI-Defaultwerten. Erstelle ein neues Profil, wenn du diese Engine anders konfigurieren möchtest.': 'UCI default values. Create a new profile if you want to configure this engine differently.',
              'Die Werte werden hier nur angezeigt. Klicke einen Wert an, um genau diese Option zu bearbeiten.': 'Values are only displayed here. Click a value to edit that specific option.',
              '${name}: ${displayValue} · zum Bearbeiten klicken': '${name}: ${displayValue} · click to edit',
              '${profileOptionEditor.name} bearbeiten': 'Edit ${profileOptionEditor.name}',
              'Editor schließen': 'Close editor',
              'Profilwert': 'Profile value',
              '>\n                  Abbrechen\n                </button>': '>\n                  Cancel\n                </button>',
              '<button type="submit">Übernehmen</button>': '<button type="submit">Apply</button>',

              # EngineManager.
              'Engine-Liste konnte nicht geladen werden: ${String(e)}': 'Could not load engine list: ${String(e)}',
              'Engine-Protokoll konnte nicht geladen werden: ${String(e)}': 'Could not load engine log: ${String(e)}',
              'Engine-Prozess konnte nicht beendet werden: ${String(e)}': 'Could not terminate engine process: ${String(e)}',
              'Engine-Instanz auswählen.': 'Select an engine instance.',
              '"Beende…"': '"Terminating…"',
              '"Prozess beenden"': '"Terminate process"',
              '>Exit-Code<': '>Exit code<',
              '>Letzte Aktivität<': '>Last activity<',
              '>Log-Einträge<': '>Log entries<',
              'max. 2000 letzte Einträge pro Instanz': 'up to 2000 most recent entries per instance',
              'Noch keine Kommunikation protokolliert.': 'No communication has been logged yet.',
              'Schließen': 'Close',
              'Keine aktuelle Engine-Instanz registriert.': 'No active engine instance is registered.',
              'Ordnungsgemäß geschlossene UCI-Instanzen und ihre Protokolle': 'Gracefully closed UCI instances and their logs',
              'Noch keine geschlossene Engine-Instanz vorhanden.': 'No closed engine instance is available yet.',
          }

          files = [
              Path('src/ChessBoard.tsx'),
              Path('src/AnalysisEvaluationOutputPortal.tsx'),
              Path('src/EngineConfigManager.tsx'),
              Path('src/EngineManager.tsx'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in sorted(replacements.items(), key=lambda item: len(item[0]), reverse=True):
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'translated {path}')

          # The scan and transformation workflows are temporary implementation aids.
          for workflow in [
              Path('.github/workflows/tmp-ui-language-scan.yml'),
              Path('.github/workflows/tmp-translate-ui.yml'),
          ]:
              if workflow.exists():
                  workflow.unlink()
          PY

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Report remaining likely German UI text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          markers = [
              'Analyse', 'Partie', 'Halbzug', 'Halbzüge', 'Stellung', 'Brettstellung',
              'Weiß', 'Schwarz', 'Schließen', 'Abbrechen', 'Übernehmen', 'auswähl',
              'konnte nicht', 'Fehler beim', 'Noch keine', 'Kein Profil', 'Keine Engine',
              'Schritt ', 'wiederverwendbar', 'Defaultwert', 'einschalten', 'ausschalten',
              'Fortsetzung', 'Varianten', 'Bewertungsverlauf', 'Bedenkzeit', 'Züge-Regel'
          ]
          rx = re.compile('|'.join(re.escape(x) for x in markers), re.IGNORECASE)
          for path in sorted(Path('src').glob('*.tsx')):
              for no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if rx.search(line):
                      print(f'REMAINING {path}:{no}: {line}')
          PY

      - name: Commit translated UI
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No translation changes.'
            exit 0
          fi
          git commit -m 'Translate displayed UI text to English'
          git push origin work
