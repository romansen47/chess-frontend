              'Analyse-Replay konnte nicht gestartet werden.': 'Could not start analysis replay.',
              'Analyse abgebrochen.': 'Analysis canceled.',
              '${ply}. Halbzug': 'Ply ${ply}',
              '${point.ply}. Halbzug · ': 'Ply ${point.ply} · ',
              '<strong>Analyseverlauf</strong>': '<strong>Analysis history</strong>',
              '} Halbzüge · {': '} plies · {',
              'Bewertungsverlauf der analysierten Partie': 'Evaluation history of the analyzed game',
              'analysisReplayStatus ?? "Analysemodus"': 'analysisReplayStatus ?? "Analysis mode"',
              'Zug in der MoveList anklicken, um eine Engine-Fortsetzung abzuspielen.': 'Click a move in the move list to play an engine continuation.',
              'Nach Auswahl eines Zuges erscheinen hier die gespeicherten Engine-Varianten.': 'Select a move to show the stored engine variations here.',
              'Für diesen Halbzug liegt noch keine Bewertung vor.': 'No evaluation is available for this ply yet.',
              'Für diese Stellung wurden keine Engine-Varianten geliefert.': 'No engine variations were provided for this position.',
              'Engine-Fortsetzung ab ${analysisSelectedPosition.label}': 'Engine continuation from ${analysisSelectedPosition.label}',
              '"Engine-Fortsetzung"': '"Engine continuation"',
