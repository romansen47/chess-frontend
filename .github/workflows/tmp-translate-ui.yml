              'Brettstellung der EvaluationEngine ist nicht verfügbar.': 'The EvaluationEngine board position is not available.',
              'Analyse-Engine-Linien': 'Analysis engine lines',
              'EvaluationEngine-Fortsetzung ab ${activePly}. Halbzug': 'EvaluationEngine continuation from ply ${activePly}',
              'EvaluationEngine-Fortsetzung': 'EvaluationEngine continuation',
              'EvaluationEngine-Varianten · infinite': 'EvaluationEngine variations · infinite',
              'Evaluation für Halbzug ${activePly} wird berechnet…': 'Evaluation for ply ${activePly} is being calculated…',
              'Evaluation-Bar einschalten, um die ausgewählte Stellung infinite zu analysieren.': 'Enable the evaluation bar to analyze the selected position infinitely.',

              # ChessBoard: game results and errors.
