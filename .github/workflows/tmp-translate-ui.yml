              '[performMove] Fehler beim Ausführen des Zugs:': '[performMove] move execution failed:',
              '[handlePiecePointerUp] Fehler beim optimistischen Drag-Drop-Zug:': '[handlePiecePointerUp] optimistic drag-and-drop move failed:',

              # ChessBoard: analysis status and views.
