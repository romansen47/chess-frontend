name: Apply native engine picker frontend changes

on:
  push:
    branches:
      - fix/native-engine-picker

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-engine-picker
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply frontend changes
        run: python3 .github/scripts/apply_native_picker_frontend.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit final changes and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/apply-native-engine-picker-frontend.yml
          rm .github/scripts/apply_native_picker_frontend.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EngineConfigManager.tsx src/i18n/I18nProvider.tsx .github/workflows/apply-native-engine-picker-frontend.yml .github/scripts/apply_native_picker_frontend.py
          git commit -m "Add cross-platform engine picker fallback"
          git push origin HEAD:fix/native-engine-picker
