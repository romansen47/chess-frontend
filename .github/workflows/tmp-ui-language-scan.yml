name: Temporary UI language scan

on:
  push:
    branches: [work]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source for likely German UI text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('src')]
          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.html'}
          markers = [
              'Analyse', 'analys', 'Partie', 'Spiel', 'Zug', 'Züge', 'Halbzug', 'Halbzüge',
              'Stellung', 'Brett', 'Weiß', 'Schwarz', 'für', 'wird', 'werden', 'wurde',
              'keine', 'Kein', 'Fehler', 'konnte', 'nicht', 'auswähl', 'öffnen', 'schließen',
              'Schließen', 'Abbrechen', 'abbrechen', 'Zurück', 'zurück', 'Löschen', 'löschen',
              'Speichern', 'speichern', 'Erstellen', 'erstellen', 'Bearbeiten', 'bearbeiten',
              'Wert', 'Werte', 'Profil', 'Engine-Datei', 'Datei', 'Pfad', 'Sekunden', 'Sekunde',
              'Tiefe', 'Bedenkzeit', 'verfügbar', 'verwend', 'einschalten', 'ausschalten',
              'Fertig', 'fertig', 'läuft', 'Laufende', 'erneut', 'Optionen', 'Einstellungen',
              'Standard', 'Zurücksetzen', 'zurücksetzen', 'ausgeführt', 'übernommen',
              'ausgewählt', 'angezeigt', 'geliefert', 'abgeschlossen', 'Startposition',
              'Fortsetzung', 'Varianten', 'Bewertung', 'Bewertungs', 'geladen', 'Geladene'
          ]
          marker_re = re.compile('|'.join(re.escape(x) for x in markers), re.IGNORECASE)
          non_ascii = re.compile(r'[^\x00-\x7f]')

          for root in roots:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path.suffix not in suffixes:
                      continue
                  for no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      # Deliberately broad: output any line that has a likely German marker or
                      # non-ASCII text so that user-visible literals are not missed.
                      if marker_re.search(line) or non_ascii.search(line):
                          print(f'{path}:{no}: {line}')
          PY
