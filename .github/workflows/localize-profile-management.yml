name: Localize profile management

on:
  push:
    branches:
      - refactor/new-game-dialog

permissions:
  contents: write

jobs:
  localize-profile-management:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/new-game-dialog

      - name: Apply profile localization
        run: |
          python .github/scripts/localize_profile_management.py
          git diff --check

      - name: Commit profile localization
        run: |
          rm .github/workflows/localize-profile-management.yml
          rm .github/scripts/localize_profile_management.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EngineConfigManager.tsx src/i18n/I18nProvider.tsx .github/workflows/localize-profile-management.yml .github/scripts/localize_profile_management.py
          git commit -m "Localize engine profile management"
          git push origin HEAD:refactor/new-game-dialog
